name: Deploy Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'macros.py'
      - 'hooks/**'
      - 'index.html'
  schedule:
    # Daily catch-up in case the addon repo's notify webhook is missed
    - cron: '0 3 * * *'
  repository_dispatch:
    types: [addon-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The addon repo is the single source of truth for UI strings.
      # We shallow-clone it and run its manifest extractor in-place.
      # The addon repo is private, so we need a PAT secret with
      # `Contents: Read` permission on niwo-dev/Takes-for-Blender.
      - name: Checkout addon source
        uses: actions/checkout@v4
        with:
          repository: niwo-dev/Takes-for-Blender
          path: .addon-src
          ref: main
          token: ${{ secrets.ADDON_REPO_READ_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs + macros plugin
        run: pip install mkdocs-material mkdocs-macros-plugin

      - name: Generate UI manifest from addon source
        run: |
          mkdir -p docs/_data
          python .addon-src/dev/build/manifest_extractor.py \
            --addon-root .addon-src \
            --out docs/_data/ui_manifest.json
          echo "manifest counts:"
          python -c "import json; m=json.load(open('docs/_data/ui_manifest.json')); print(m['_meta']['counts'])"

      # The header's version chip. The addon repo is private, so the browser
      # can't read this — resolve it here, where the read token exists, and
      # bake it into the build. Falls back to the manifest version.
      - name: Resolve latest addon release
        env:
          GH_TOKEN: ${{ secrets.ADDON_REPO_READ_TOKEN }}
        run: |
          tag="$(gh api repos/niwo-dev/Takes-for-Blender/releases/latest \
                   --jq .tag_name 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "No readable published release - falling back to the manifest version."
            tag="v$(python -c "import json; print(json.load(open('docs/_data/ui_manifest.json'))['addon']['version'])")"
          fi
          python - "$tag" <<'PY'
          import json, sys
          tag = sys.argv[1]
          with open("docs/_data/release.json", "w", encoding="utf-8") as fh:
              json.dump({"tag": tag, "version": tag.lstrip("vV")}, fh, indent=2)
          PY
          echo "latest release:"; cat docs/_data/release.json

      - name: Generate roadmap board from addon source
        run: |
          python .addon-src/dev/scripts/build_wiki_roadmap.py \
            --addon-root .addon-src \
            --wiki .
          echo "roadmap pages:"; ls docs/roadmap

      - name: Mirror changelogs from addon source
        run: |
          mkdir -p docs/changelog
          # Both mirrored pages open with `render_macros: false`. The changelogs
          # are release prose, not templates: they quote Jinja-looking snippets
          # while describing the wiki's own macros, and mkdocs-macros would try
          # to EXECUTE those quotes (backticks do not protect them), failing the
          # build under on_error_fail. Opting the pages out keeps any future
          # changelog wording safe. The addon files may carry a UTF-8 BOM, which
          # would hide the front matter from the parser -- strip it first.
          optout=$'---\nrender_macros: false\n---\n\n'
          printf '%s' "$optout" > docs/changelog/index.md
          sed '1s/^\xEF\xBB\xBF//' .addon-src/CHANGELOG.md >> docs/changelog/index.md
          # Dev changelog: adapt two GitHub-only link forms so mkdocs --strict
          # (which aborts on any unresolved link) passes on the mirrored page:
          #   1. the intro's [CHANGELOG.md](CHANGELOG.md) sibling link -> the
          #      user changelog page (index.md, same dir);
          #   2. any [text](path/to/source.py#L..) link -> inline `code`, since
          #      source files aren't wiki docs. The dev log uses backticks for
          #      file refs, so (2) is a belt-and-suspenders guard.
          printf '%s' "$optout" > docs/changelog/dev.md
          sed -E \
            -e '1s/^\xEF\xBB\xBF//' \
            -e 's#\[CHANGELOG\.md\]\(CHANGELOG\.md\)#[CHANGELOG.md](index.md)#g' \
            -e 's#\[([^][]*)\]\([^)]*\.py[^)]*\)#`\1`#g' \
            .addon-src/CHANGELOG_DEV.md >> docs/changelog/dev.md
          echo "changelog pages:"; ls docs/changelog

      # The verifier writes its findings to a file and exits 1 on drift, so a
      # bare invocation fails with an empty log. Print what it found — the
      # page, line and stale reference — before letting the step fail.
      - name: Verify wiki against manifest (string drift)
        run: |
          set +e
          python .addon-src/dev/build/verify_wiki.py \
            --wiki docs \
            --manifest docs/_data/ui_manifest.json \
            --out /tmp/verify_findings.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Wiki drift: the wiki names add-on strings that no longer exist."
            python - <<'PY'
          import json
          try:
              findings = json.load(open("/tmp/verify_findings.json", encoding="utf-8"))["findings"]
          except Exception as exc:                       # noqa: BLE001 - diagnostics only
              print(f"(could not read findings: {exc})")
              raise SystemExit(0)
          for f in findings:
              print(f"{f.get('severity', '?').upper():<6} "
                    f"{f.get('wiki_file')}:{f.get('wiki_line')}  "
                    f"{f.get('kind')} '{f.get('ref')}'")
              if f.get("description"):
                  print(f"       {f['description']}")
          print(f"\n{len(findings)} finding(s). Fix the page, or update the reference.")
          PY
          fi
          exit "$status"

      - name: Build MkDocs into wiki subdirectory
        run: mkdocs build --strict

      - name: Assemble deploy directory
        run: |
          mkdir -p deploy/wiki
          cp index.html deploy/
          cp -r media deploy/
          cp -r site/* deploy/wiki/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
