<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Takes for Blender — Promo</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{--void:#0a0a0c;--surf:#121215;--float:#1e1e24;--o:#e87d0d;--o2:#f5a623;--b:#265787;--b2:#3a7bc8;--teal:#2fc4b2;--txt:#eef1f6;--mut:#9aa3b5}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;width:100%;height:100%;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--void);overflow:hidden;
         font-family:Inter,sans-serif;color:var(--txt);transform-origin:0 0}
  .abs{position:absolute}
  .scene{position:absolute;inset:0;visibility:hidden}
  h1,h2,.disp{font-family:Outfit,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:.95}
  .mono{font-family:'JetBrains Mono',monospace;font-weight:500}
  .grad{background:linear-gradient(90deg,var(--b2),var(--o2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .line{overflow:hidden;padding:.06em 0 .12em;margin:-.06em 0 -.12em}
  .line>span{display:block;will-change:transform}
  .kicker{font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--o);font-size:26px;letter-spacing:.22em}
  .lede{font-size:34px;line-height:1.4;color:var(--mut);font-weight:400}
  .glass{background:rgba(38,87,135,.2);border:1px solid rgba(255,255,255,.08);border-radius:8px;
         backdrop-filter:blur(16px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .pill{font-family:'JetBrains Mono',monospace;font-size:19px;letter-spacing:.12em;padding:6px 12px;border-radius:4px;
        border:1px solid rgba(255,255,255,.14);color:var(--mut);white-space:nowrap}
  .row{position:absolute;left:24px;right:24px;display:flex;align-items:center;border-radius:6px}
  .dot{width:20px;height:20px;border-radius:5px;margin-right:18px;flex:none}
  .rname{font-family:Outfit;font-weight:600;font-size:34px}
  .rsub{font-size:22px;color:var(--mut);margin-left:16px}
  .chip{font-family:'JetBrains Mono',monospace;font-size:26px;padding:8px 18px;border-radius:6px;border:2px solid;white-space:nowrap}
  #wipe>div{position:absolute;top:-10px;height:1100px;width:2300px;left:-2300px;transform:skewX(-14deg)}
</style>
</head>
<body>
<div id="stage">
  <!-- background -->
  <div class="abs" id="glowA" style="left:-300px;top:-400px;width:1400px;height:1400px;background:radial-gradient(closest-side,rgba(58,123,200,.28),transparent)"></div>
  <div class="abs" id="glowB" style="right:-400px;bottom:-500px;width:1500px;height:1500px;background:radial-gradient(closest-side,rgba(232,125,13,.22),transparent)"></div>
  <div class="abs" style="left:-500px;top:520px;width:2920px;height:1400px;transform:perspective(900px) rotateX(64deg);transform-origin:50% 0;
       -webkit-mask-image:linear-gradient(to bottom,#000,transparent 90%);mask-image:linear-gradient(to bottom,#000,transparent 90%)">
    <div id="grid" class="abs" style="inset:0;background-image:linear-gradient(rgba(58,123,200,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(58,123,200,.35) 2px,transparent 2px);background-size:110px 110px"></div>
  </div>
  <svg class="abs" id="rings" width="1920" height="1080" style="left:0;top:0"></svg>

  <div id="scenes"></div>

  <!-- HUD -->
  <div id="hud" class="abs mono" style="right:80px;top:56px;font-size:22px;letter-spacing:.2em;color:var(--mut);opacity:0"></div>
  <div class="abs" style="left:0;bottom:0;height:6px;width:100%;background:rgba(255,255,255,.05)"><div id="bar" style="height:100%;width:0;background:linear-gradient(90deg,var(--b2),var(--o2))"></div></div>
  <div id="wipe" class="abs" style="inset:0"><div style="background:var(--b2)"></div><div style="background:var(--o)"></div><div style="background:#0a0a0c"></div></div>
</div>

<script>
/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,s,d)=>clamp((t-s)/d);
const eOut=x=>1-Math.pow(1-x,4);
const eExp=x=>x>=1?1:1-Math.pow(2,-10*x);
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',')+')'};
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const rev=(el,t,s,d=.7)=>{const p=eExp(prog(t,s,d));el.style.transform=`translateY(${(1-p)*115}%)`};
const pop=(el,t,s,d=.55,y=0)=>{const p=prog(t,s,d),e=eBack(p);el.style.opacity=clamp(p*4);el.style.transform=`translateY(${(1-e)*y}px) scale(${lerp(.6,1,e)})`};
const slide=(el,t,s,d=.6,x=80)=>{const p=eExp(prog(t,s,d));el.style.opacity=clamp(p*3);el.style.transform=`translateX(${(1-p)*x}px)`};
const line=(txt,cls,style='')=>`<div class="line disp" style="${style}"><span class="${cls||''}">${txt}</span></div>`;

/* ---------- product (abstract watch, pure vector) ---------- */
let uid=0;
const STATES=[
  {n:'Gold',      case:'#d9a441',strap:'#6b4423',dial:'#17171b',hand:'#f3e2b3',acc:'#e87d0d',mats:['Brushed Gold','Tan Leather','Onyx']},
  {n:'Silver',    case:'#cfd6e2',strap:'#2f4468',dial:'#eef1f6',hand:'#1a1f2b',acc:'#3a7bc8',mats:['Polished Steel','Navy Fabric','Pearl']},
  {n:'Matte Black',case:'#34343a',strap:'#18181b',dial:'#0c0c0f',hand:'#dfe3ea',acc:'#f5a623',mats:['Black Anodized','Rubber','Carbon']},
];
function watch(w){
  const i=uid++;
  return $(`<svg viewBox="0 0 400 560" width="${w}" height="${w*1.4}" style="overflow:visible">
   <defs><radialGradient id="g${i}" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
   <linearGradient id="s${i}" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient></defs>
   <rect class="strap" x="145" y="-10" width="110" height="215" rx="22"/><rect x="145" y="-10" width="110" height="215" rx="22" fill="url(#s${i})"/>
   <rect class="strap" x="145" y="355" width="110" height="215" rx="22"/><rect x="145" y="355" width="110" height="215" rx="22" fill="url(#s${i})"/>
   <g stroke="#fff" stroke-opacity=".22" stroke-width="3" stroke-dasharray="10 9"><line x1="165" y1="20" x2="165" y2="190"/><line x1="235" y1="20" x2="235" y2="190"/><line x1="165" y1="370" x2="165" y2="545"/><line x1="235" y1="370" x2="235" y2="545"/></g>
   <rect class="case" x="322" y="266" width="30" height="28" rx="6"/>
   <circle class="case" cx="200" cy="280" r="132"/><circle cx="200" cy="280" r="132" fill="url(#g${i})"/>
   <circle cx="200" cy="280" r="112" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="4"/>
   <circle class="dial" cx="200" cy="280" r="102"/><circle cx="200" cy="280" r="102" fill="url(#g${i})" opacity=".5"/>
   <g class="hand" stroke-width="7" stroke-linecap="round">${[...Array(12)].map((_,k)=>{const a=k*Math.PI/6,r1=k%3?84:76,r2=92;return `<line x1="${200+Math.sin(a)*r1}" y1="${280-Math.cos(a)*r1}" x2="${200+Math.sin(a)*r2}" y2="${280-Math.cos(a)*r2}" stroke-width="${k%3?4:8}"/>`}).join('')}</g>
   <g class="hand" stroke-linecap="round"><line class="hh" x1="200" y1="280" x2="200" y2="220" stroke-width="10"/><line class="mh" x1="200" y1="280" x2="200" y2="196" stroke-width="7"/></g>
   <line class="acc sh" x1="200" y1="300" x2="200" y2="190" stroke-width="3.5" stroke-linecap="round"/>
   <circle class="acc" cx="200" cy="280" r="8"/></svg>`);
}
function paint(svg,a,b,k,t){
  const f=(key)=>mix(a[key],b[key],k);
  svg.querySelectorAll('.strap').forEach(e=>e.style.fill=f('strap'));
  svg.querySelectorAll('.case').forEach(e=>e.style.fill=f('case'));
  svg.querySelectorAll('.dial').forEach(e=>e.style.fill=f('dial'));
  svg.querySelectorAll('.hand').forEach(e=>e.style.stroke=f('hand'));
  svg.querySelectorAll('.acc').forEach(e=>{e.style.stroke=f('acc');e.style.fill=f('acc')});
  const rot=(sel,deg)=>svg.querySelector(sel).setAttribute('transform',`rotate(${deg} 200 280)`);
  rot('.hh',(t*3+300)%360);rot('.mh',(t*36+40)%360);rot('.sh',(t*180)%360);
}
function stateAt(t,per,off=0){ // returns [a,b,k]
  const x=(t-off)/per,i=Math.floor(x),f=x-i,k=eIO(clamp((f-.62)/.38));
  return [STATES[((i%3)+3)%3],STATES[(((i+1)%3)+3)%3],k,((i%3)+3)%3,(((i+1)%3)+3)%3];
}

/* ---------- mark (own geometric mark, stacked take-layers) ---------- */
function mark(sz){
  return $(`<svg viewBox="-80 -70 160 150" width="${sz}" height="${sz*.94}" style="overflow:visible">
   <defs><linearGradient id="mk" x1="0" x2="1"><stop offset="0" stop-color="#e87d0d"/><stop offset="1" stop-color="#f5a623"/></linearGradient></defs>
   <g fill="none" stroke-linejoin="round" stroke-width="7">
    <path class="ml3" d="M0-24L64 8 0 40-64 8Z" transform="translate(0 44)" stroke="#265787" fill="rgba(38,87,135,.35)"/>
    <path class="ml2" d="M0-24L64 8 0 40-64 8Z" transform="translate(0 22)" stroke="#3a7bc8" fill="rgba(58,123,200,.35)"/>
    <path class="ml1" d="M0-24L64 8 0 40-64 8Z" stroke="url(#mk)" fill="rgba(232,125,13,.45)"/></g></svg>`);
}

/* ---------- scenes ---------- */
const LONG=new URLSearchParams(location.search).has('long');   // ?long -> ~60 s cut, default -> 20 s cut
const T=LONG?[0,4.5,9,17,27,36,44,53,59]:[0,2.2,4,6.8,10,12.8,15.2,17.9,19.8]; // scene boundaries (s)
const S=LONG?[.67,.67,.6,.52,.45,.5,.47,.52]:[1.3,1.6,1.7,1.6,1.4,1.7,1.5,1.6]; // per-scene playback speed
const LEDE=LONG?[
 'Scenes, view layers and shots — organised as one hierarchy, right inside Blender.',
 'Assign a camera, world or preset at any level. Every level below inherits it — until one says otherwise.',
 'One product, one file. Switch materials per shot — nothing is copied, nothing to keep in sync.',
 'Key a property and its old value is remembered. Switch shots and anything unkeyed snaps back to the rest pose.',
 'Every shot and every variant in one click — foreground or in the background — named by tokens.'
]:[
 'Scenes, layers and shots. One hierarchy.','Set it high. Every level below inherits.','One product. Every finish. No copies.',
 'Unkeyed properties always return home.','Every shot and variant. One click.'];
const sceneEls=[],updaters=[];
const host=document.getElementById('scenes');
function scene(build){const el=$('<div class="scene"></div>');host.appendChild(el);sceneEls.push(el);updaters.push(build(el));}

/* 0 HOOK */
scene(el=>{
  const L=[['ONE FILE.','#eef1f6'],['EVERY LOOK.','#eef1f6'],['ZERO COPIES.','grad']];
  const ws=L.map((l,i)=>{const d=$(line(l[0],l[1]==='grad'?'grad':'','font-size:176px;position:absolute;left:120px;top:'+(190+i*200)+'px;white-space:nowrap'));el.appendChild(d);return d.firstChild});
  const w=watch(420);w.style.cssText+='position:absolute;left:1390px;top:170px';el.appendChild(w);
  const ring=$('<div class="abs" style="left:1400px;top:240px;width:380px;height:380px;border-radius:50%;border:3px solid var(--o)"></div>');el.appendChild(ring);
  const tags=['GOLD','SILVER','MATTE BLACK'].map((s,i)=>{const p=$(`<div class="pill" style="position:absolute;left:1420px;top:${840}px;opacity:0;font-size:26px;color:#fff;border-color:var(--o)">${s}</div>`);el.appendChild(p);return p});
  return lt=>{
    [0.15,0.95,1.75].forEach((s,i)=>rev(ws[i],lt,s,.6));
    const [a,b,k,ia,ib]=stateAt(lt,.95,.9);paint(w,a,b,k,lt);
    const wp=eBack(prog(lt,.1,.9));w.style.transform=`translateY(${(1-wp)*120}px) rotate(${lerp(-25,0,wp)+Math.sin(lt*2)*3}deg) scale(${.7+.3*wp})`;w.style.opacity=clamp(wp*3);
    const r=(lt*1.4)%1;ring.style.transform=`scale(${1+r*.7})`;ring.style.opacity=(1-r)*.7*clamp(lt);
    tags.forEach((p,i)=>{const on=(k<.5?ia:ib)===i&&lt>.9;p.style.opacity=on?1:0;p.style.transform=`translateY(${on?0:12}px)`;p.style.background=on?'var(--o)':''});
  };
});

/* 1 TITLE */
scene(el=>{
  const m=mark(300);m.style.cssText+=';position:absolute;left:810px;top:120px';el.appendChild(m);
  const word='TAKES';const wl=$(`<div class="disp" style="position:absolute;left:0;width:1920px;top:440px;text-align:center;font-size:250px;display:flex;justify-content:center;gap:6px">${[...word].map(c=>`<div class="line" style="display:block"><span class="grad" style="display:block">${c}</span></div>`).join('')}</div>`);el.appendChild(wl);
  const sub=$(`<div class="disp" style="position:absolute;left:0;width:1920px;top:690px;text-align:center;font-size:74px;color:var(--txt);letter-spacing:.32em;font-weight:600">${line('FOR BLENDER','','display:inline-block')}</div>`);el.appendChild(sub);
  const tag=$('<div class="lede" style="position:absolute;left:0;width:1920px;top:800px;text-align:center;font-size:34px">Stage management for Blender 5.0+</div>');el.appendChild(tag);
  const names=['THE TREE','THE CASCADE','VARIANTS','REST STATE','BATCH RENDER'];
  const chips=names.map((n,i)=>{const c=$(`<div class="pill" style="position:absolute;top:920px;left:${(1920-5*290)/2+i*290+8}px;width:274px;text-align:center;font-size:20px;padding:12px 0;color:#fff;background:rgba(38,87,135,.35)"><span style="color:var(--o2)">0${i+1}</span>&nbsp; ${n}</div>`);el.appendChild(c);return c});
  return lt=>{
    const p=eBack(prog(lt,0,.8));m.style.transform=`rotate(${(1-eOut(prog(lt,0,1)))*-200}deg) scale(${p})`;m.style.opacity=clamp(p*3);
    [1,2,3].forEach(n=>{const l=m.querySelector('.ml'+n);const q=eBack(prog(lt,.35+(3-n)*.12,.6));l.style.transform=`translateY(${(1-q)*-40}px)`});
    wl.querySelectorAll('span').forEach((s,i)=>s.style.transform=`translateY(${(1-eExp(prog(lt,.45+i*.07,.6)))*115}%)`);
    sub.querySelector('span').style.transform=`translateY(${(1-eExp(prog(lt,1.1,.6)))*115}%)`;
    tag.style.opacity=eOut(prog(lt,1.5,.5));
    chips.forEach((c,i)=>pop(c,lt,1.7+i*.12,.5,30));
  };
});

/* principle scaffold */
function principle(el,num,l1,l2,body){
  const k=$(`<div class="kicker abs" style="left:120px;top:150px;opacity:0">PRINCIPLE ${num} / 05</div>`);
  const a=$(line(l1,'','font-size:104px;position:absolute;left:120px;top:215px;white-space:nowrap'));
  const b=$(line(l2,'grad','font-size:104px;position:absolute;left:120px;top:325px;white-space:nowrap'));
  const p=$(`<div class="lede abs" style="left:120px;top:520px;width:640px;opacity:0">${body}</div>`);
  el.append(k,a,b,p);
  return lt=>{k.style.opacity=eOut(prog(lt,0,.4));rev(a.firstChild,lt,.1,.6);rev(b.firstChild,lt,.25,.6);p.style.opacity=eOut(prog(lt,.6,.5));p.style.transform=`translateY(${(1-eOut(prog(lt,.6,.5)))*24}px)`;};
}

/* 2 TREE */
scene(el=>{
  const head=principle(el,'01','ONE TREE','FOR EVERYTHING',LEDE[0]);
  const panel=$('<div class="glass abs" style="left:900px;top:130px;width:900px;height:800px"></div>');el.appendChild(panel);
  const R=[['Global','project defaults','GLOBAL',0,'#9aa3b5'],['Interior','','SCENE GROUP',1,'#3a7bc8'],['Kitchen','','SCENE',2,'#3a7bc8'],
           ['Hero Shots','','VIEW LAYER GROUP',3,'#f5a623'],['Front 3/4','','VIEW LAYER',4,'#f5a623'],['Take 1 · Blockout','','TAKE',5,'#e87d0d'],['Take 2 · Night lighting','','TAKE',5,'#e87d0d']];
  const spine=$('<div class="abs" style="left:58px;top:40px;width:3px;background:linear-gradient(var(--b2),var(--o));height:0"></div>');panel.appendChild(spine);
  const rows=R.map((r,i)=>{const d=$(`<div class="row" style="top:${34+i*106}px;height:82px;padding-left:${28+r[3]*46}px"><div class="dot" style="background:${r[4]}"></div><div class="rname">${r[0]}</div><div class="rsub">${r[1]}</div><div class="pill" style="margin-left:auto;margin-right:20px">${r[2]}</div></div>`);panel.appendChild(d);return d});
  const cap=$('<div class="mono abs" style="left:900px;top:960px;width:900px;text-align:center;font-size:24px;color:var(--o2);letter-spacing:.2em;opacity:0">WIDEST  →  NARROWEST</div>');el.appendChild(cap);
  return lt=>{
    head(lt);
    const pp=eOut(prog(lt,.3,.6));panel.style.opacity=pp;panel.style.transform=`translateX(${(1-pp)*120}px)`;
    spine.style.height=(eOut(prog(lt,.7,2.4))*690)+'px';
    rows.forEach((r,i)=>{const s=.7+i*.36;slide(r,lt,s,.5,60);
      const sel=i===6?eOut(prog(lt,4.2,.4)):0;r.style.background=`rgba(58,123,200,${sel*.55})`;r.style.boxShadow=sel?`0 0 ${sel*30}px rgba(58,123,200,${sel*.6})`:'none';});
    cap.style.opacity=eOut(prog(lt,3.4,.5));
  };
});

/* 3 CASCADE */
scene(el=>{
  const head=principle(el,'02','SET ONCE.','DEEPEST WINS.',LEDE[1]);
  const panel=$('<div class="glass abs" style="left:900px;top:130px;width:900px;height:800px"></div>');el.appendChild(panel);
  const tiers=['GLOBAL','SCENE GROUP','SCENE','VIEW LAYER GROUP','VIEW LAYER','TAKE'];
  const EV=[{tier:0,t:1.0,name:'Cam_Wide',c:'#3a7bc8'},{tier:3,t:2.6,name:'Cam_Hero',c:'#e87d0d'},{tier:5,t:4.1,name:'Cam_Detail',c:'#2fc4b2'}];
  const rows=tiers.map((n,i)=>{const d=$(`<div class="row" style="top:${34+i*122}px;height:96px;padding:0 24px;border:1px solid rgba(255,255,255,.06);background:rgba(10,10,12,.35)">
     <div class="rname" style="font-size:30px;width:330px;font-family:'JetBrains Mono';letter-spacing:.06em">${n}</div>
     <div class="mono st" style="font-size:20px;color:var(--mut);width:180px"></div><div class="chip" style="margin-left:auto">—</div></div>`);panel.appendChild(d);return d});
  const caps=['Set the camera at the top…','…override it for a whole group…','…or for a single take.'].map((s,i)=>{const c=$(`<div class="mono abs" style="left:120px;top:800px;font-size:28px;color:${EV[i].c==='#e87d0d'?'#f5a623':EV[i].c};opacity:0;width:700px">${s}</div>`);el.appendChild(c);return c});
  return lt=>{
    head(lt);
    const pp=eOut(prog(lt,.3,.6));panel.style.opacity=pp;panel.style.transform=`translateX(${(1-pp)*120}px)`;
    rows.forEach((r,j)=>{
      let win=null,wa=0;
      EV.forEach(e=>{if(e.tier<=j){const arr=e.t+(j-e.tier)*.2;if(lt>=arr&&(!win||e.tier>=win.tier)){win=e;wa=arr}}});
      const chip=r.querySelector('.chip'),st=r.querySelector('.st');
      const own=EV.find(e=>e.tier===j&&lt>=e.t);
      if(win){const fl=Math.exp(-(lt-wa)*4);chip.textContent=win.name;chip.style.color=win.c;chip.style.borderColor=win.c;
        chip.style.background=`rgba(${hex(win.c).join(',')},${.12+fl*.5})`;chip.style.boxShadow=`0 0 ${fl*40}px ${win.c}`;chip.style.transform=`scale(${1+fl*.12})`;}
      else{chip.textContent='—';chip.style.color='#555';chip.style.borderColor='#333';chip.style.background='none';chip.style.boxShadow='none';chip.style.transform='none'}
      st.textContent=own?'● SET HERE':(win?'↳ inherited':'');st.style.color=own?win.c:'#6b7385';
      r.style.borderColor=own?win.c:'rgba(255,255,255,.06)';
      slide(r,lt,.5+j*.08,.5,60);
    });
    caps.forEach((c,i)=>{const s=EV[i].t-.3,e=(EV[i+1]?EV[i+1].t-.3:99);c.style.opacity=lt>=s&&lt<e?eOut(prog(lt,s,.3)):0;});
  };
});

/* 4 VARIANTS */
scene(el=>{
  const head=principle(el,'03','VARIANTS,','NOT DUPLICATES',LEDE[2]);
  const w=watch(500);w.style.cssText+=';position:absolute;left:1180px;top:150px';el.appendChild(w);
  const halo=$('<div class="abs" style="left:1120px;top:250px;width:620px;height:620px;border-radius:50%;border:3px solid;opacity:0"></div>');el.appendChild(halo);
  const parts=['CASE','STRAP','DIAL'];
  const panel=$('<div class="glass abs" style="left:120px;top:690px;width:760px;height:290px"></div>');el.appendChild(panel);
  const prow=parts.map((p,i)=>{const d=$(`<div class="row" style="top:${18+i*54}px;height:46px"><div class="mono" style="font-size:20px;color:var(--mut);width:120px;letter-spacing:.14em">${p}</div><div class="rname" style="font-size:28px">—</div></div>`);panel.appendChild(d);return d});
  const chips=STATES.map((s,i)=>{const c=$(`<div class="chip" style="position:absolute;top:196px;left:${28+i*236}px;font-size:22px;border-color:rgba(255,255,255,.2);color:var(--mut)">◇ ${s.n}</div>`);panel.appendChild(c);return c});
  const stats=['1 OBJECT','1 FILE','3 FINISHES'].map((s,i)=>{const p=$(`<div class="pill" style="position:absolute;left:${1160+i*195}px;top:900px;opacity:0;color:#fff;font-size:22px">${s}</div>`);el.appendChild(p);return p});
  return lt=>{
    head(lt);
    const wp=eBack(prog(lt,.3,.8));w.style.opacity=clamp(wp*3);
    const [a,b,k,ia,ib]=stateAt(lt,1.1,.6);const act=lt<.6?0:(k<.5?ia:ib);
    paint(w,lt<.6?STATES[0]:a,lt<.6?STATES[0]:b,lt<.6?0:k,lt);
    w.style.transform=`translateY(${(1-wp)*100}px) rotate(${Math.sin(lt*1.5)*4}deg) scale(${lerp(.7,1,wp)})`;
    const pulse=k>0&&k<1?Math.sin(k*Math.PI):0;halo.style.borderColor=mix(a.acc,b.acc,k);halo.style.opacity=pulse*.8;halo.style.transform=`scale(${.85+eOut(k)*.25})`;
    slide(panel,lt,.7,.5,-60);
    prow.forEach((r,i)=>{const t=r.lastChild;t.textContent=STATES[act].mats[i];t.style.color=i===0?mix(a.case,b.case,k):i===1?'#b7c6e6':'#eef1f6'});
    chips.forEach((c,i)=>{const on=i===act;c.style.color=on?'#fff':'var(--mut)';c.style.borderColor=on?'var(--o)':'rgba(255,255,255,.2)';c.style.background=on?'rgba(232,125,13,.3)':'none';c.textContent=(on?'● ':'◇ ')+STATES[i].n});
    stats.forEach((p,i)=>pop(p,lt,1.4+i*.18,.5,20));
  };
});

/* 5 REST STATE */
scene(el=>{
  const head=principle(el,'04','NOTHING','DRIFTS',LEDE[3]);
  const stage=$('<div class="glass abs" style="left:900px;top:250px;width:900px;height:640px;overflow:hidden"></div>');el.appendChild(stage);
  stage.innerHTML='<svg width="900" height="640" style="position:absolute;left:0;top:0"><path id="arc" d="M150 480 C 300 90, 600 90, 760 280" fill="none" stroke="rgba(245,166,35,.35)" stroke-width="3" stroke-dasharray="8 10"/></svg>';
  const arc=stage.querySelector('#arc'),len=arc.getTotalLength();
  const ghost=$('<div class="abs" style="left:110px;top:440px;width:80px;height:80px;border-radius:50%;border:3px dashed rgba(255,255,255,.5)"></div>');stage.appendChild(ghost);
  const ghl=$('<div class="mono abs" style="left:60px;top:534px;font-size:20px;letter-spacing:.14em;color:var(--mut)">REST STATE</div>');stage.appendChild(ghl);
  const ball=$('<div class="abs" style="width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd28a,#e87d0d 60%,#8a3f00)"></div>');stage.appendChild(ball);
  const sa=$('<div class="chip" style="position:absolute;left:40px;top:40px;font-size:22px">SHOT A · KEYED</div>');const sb=$('<div class="chip" style="position:absolute;left:340px;top:40px;font-size:22px">SHOT B · UNKEYED</div>');
  stage.append(sa,sb);
  const snap=$('<div class="mono abs" style="left:380px;top:300px;font-size:26px;color:var(--teal);letter-spacing:.14em;opacity:0">↩ SNAPS BACK TO REST</div>');stage.appendChild(snap);
  return lt=>{
    head(lt);
    const pp=eOut(prog(lt,.3,.6));stage.style.opacity=pp;stage.style.transform=`translateX(${(1-pp)*120}px)`;
    // 1.0-3.0 shot A animates; 3.0 switch to B (snap); 4.6 A again
    let pos;const rest=[0,0];
    const m=(u)=>{const pt=arc.getPointAtLength(clamp(u)*len);return [pt.x-40,pt.y-40]};
    let mode='A';
    if(lt<.6)pos=m(0);
    else if(lt<1.7)pos=m(eIO(prog(lt,.6,1.0)));
    else if(lt<2.2){mode='B';const q=eBack(prog(lt,1.7,.5));const from=m(1),to=m(0);pos=[lerp(from[0],to[0],q),lerp(from[1],to[1],q)]}
    else if(lt<2.9){pos=m(0);mode='B'}
    else pos=m(eIO(prog(lt,2.9,1.0)));
    if(lt>=1.7&&lt<2.9)mode='B';
    ball.style.left=pos[0]+'px';ball.style.top=pos[1]+'px';
    const on=(e,x)=>{e.style.color=x?'#fff':'var(--mut)';e.style.borderColor=x?'var(--o)':'rgba(255,255,255,.2)';e.style.background=x?'rgba(232,125,13,.3)':'none'};
    on(sa,mode==='A');on(sb,mode==='B');
    snap.style.opacity=lt>=1.8&&lt<2.8?eOut(prog(lt,1.8,.25)):0;
    ghost.style.borderColor=mode==='B'?'#2fc4b2':'rgba(255,255,255,.5)';ghost.style.boxShadow=mode==='B'&&lt<2.7?`0 0 ${40*Math.exp(-(lt-2.1)*3)+8}px #2fc4b2`:'none';
  };
});

/* 6 BATCH */
scene(el=>{
  const head=principle(el,'05','RENDER','EVERYTHING',LEDE[4]);
  const combos=[];const angles=['FRONT','SIDE','TOP','DETAIL'];
  const N=12;
  const grid=$('<div class="abs" style="left:880px;top:130px;width:920px;height:520px"></div>');el.appendChild(grid);
  const tiles=[];for(let i=0;i<N;i++){const s=i%3,an=Math.floor(i/3),x=(i%4)*232,y=Math.floor(i/4)*176;
    const t=$(`<div class="glass" style="position:absolute;left:${x}px;top:${y}px;width:216px;height:160px;overflow:hidden;opacity:0"><div class="mono lbl" style="position:absolute;left:12px;bottom:8px;font-size:15px;letter-spacing:.1em;color:var(--mut)">${angles[an]} · ${STATES[s].n.split(' ').pop().toUpperCase()}</div><div class="pb" style="position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--o2)"></div><div class="ck mono" style="position:absolute;right:12px;top:8px;font-size:26px;color:var(--teal);opacity:0">✓</div></div>`);
    const wv=watch(70);wv.style.cssText+=`;position:absolute;left:73px;top:12px;opacity:0`;paint(wv,STATES[s],STATES[s],0,i*.7);wv.style.transform=`rotate(${[0,-24,90,8][an]}deg) scale(${[1,.9,.85,1.35][an]})`;wv.dataset.k=i;t.appendChild(wv);grid.appendChild(t);tiles.push({t,wv,s,an})}
  const tok=$('<div class="glass abs" style="left:880px;top:690px;width:920px;height:190px;padding:26px 34px"><div class="mono" style="font-size:18px;letter-spacing:.2em;color:var(--o)">SMART OUTPUT</div><div class="mono pat" style="font-size:36px;margin-top:14px;color:var(--b2)"></div><div class="mono res" style="font-size:30px;margin-top:16px;color:var(--o2)"></div></div>');el.appendChild(tok);
  const cnt=$('<div class="disp abs" style="left:880px;top:915px;width:920px;font-size:56px;text-align:right"><span class="grad n">0</span> <span style="color:var(--mut);font-size:36px">/ 12 RENDERED</span></div>');el.appendChild(cnt);
  const pat='[scene]_[angle]_[variant]_####.png';
  return lt=>{
    head(lt);
    tiles.forEach((o,i)=>{slide(o.t,lt,.5+i*.04,.4,40);o.wv.style.opacity=lt>.7?1:0});
    tok.style.opacity=eOut(prog(lt,.6,.5));
    tok.querySelector('.pat').textContent=pat.slice(0,Math.floor(prog(lt,.5,.6)*pat.length));
    const s0=1.2,per=.2;let done=0,cur=-1;
    tiles.forEach((o,i)=>{const p=prog(lt,s0+i*per,per);const pb=o.t.querySelector('.pb'),ck=o.t.querySelector('.ck');
      pb.style.width=(p*100)+'%';pb.style.opacity=p>=1?0:1;ck.style.opacity=p>=1?1:0;
      o.t.style.borderColor=p>0&&p<1?'var(--o2)':'rgba(255,255,255,.08)';
      if(p>=1)done++;if(p>0&&p<1)cur=i;});
    if(cur<0&&done>0)cur=done-1;
    if(cur>=0&&lt>=s0){const o=tiles[cur];tok.querySelector('.res').textContent='→ Studio_'+angles[o.an].toLowerCase()+'_'+STATES[o.s].n.toLowerCase().replace(' ','-')+'_'+String(cur+1).padStart(4,'0')+'.png'}
    else tok.querySelector('.res').textContent='';
    cnt.querySelector('.n').textContent=done;cnt.style.opacity=eOut(prog(lt,.5,.4));
  };
});

/* 7 OUTRO */
scene(el=>{
  const m=mark(220);m.style.cssText+=';position:absolute;left:850px;top:170px';el.appendChild(m);
  const t=$(`<div class="disp" style="position:absolute;left:0;width:1920px;top:440px;text-align:center;font-size:150px">${line('TAKES FOR BLENDER','grad','display:inline-block')}</div>`);el.appendChild(t);
  const L=['ONE TREE.','ONE CASCADE.','EVERY VARIANT.','EVERY RENDER.'];
  const ls=$(`<div class="disp" style="position:absolute;left:0;width:1920px;top:660px;text-align:center;font-size:58px;letter-spacing:.04em;font-weight:600;display:flex;justify-content:center;gap:40px;white-space:nowrap">${L.map((s,i)=>`<div class="line" style="flex:none"><span style="${i>1?'color:var(--o2)':''}">${s}</span></div>`).join('')}</div>`);el.appendChild(ls);
  const f=$('<div class="mono abs" style="left:0;width:1920px;top:850px;text-align:center;font-size:26px;letter-spacing:.2em;color:var(--mut)">BLENDER 5.0+</div>');el.appendChild(f);
  return lt=>{
    const p=eBack(prog(lt,0,.7));m.style.transform=`scale(${p}) rotate(${(1-eOut(prog(lt,0,.9)))*180}deg)`;m.style.opacity=clamp(p*3);
    [1,2,3].forEach(n=>{m.querySelector('.ml'+n).style.transform=`translateY(${Math.sin(lt*2.2+n)*5}px)`});
    t.querySelector('span').style.transform=`translateY(${(1-eExp(prog(lt,.3,.7)))*115}%)`;
    ls.querySelectorAll('span').forEach((s,i)=>s.style.transform=`translateY(${(1-eExp(prog(lt,.9+i*.22,.55)))*115}%)`);
    f.style.opacity=eOut(prog(lt,2.4,.6));
  };
});

/* ---------- master ---------- */
const TOTAL=T[T.length-1];
const wipes=[...document.querySelectorAll('#wipe>div')];
const hud=document.getElementById('hud');
const rings=document.getElementById('rings');
function renderAt(t){
  t=clamp(t,0,TOTAL-1/60);
  let si=0;for(let i=0;i<T.length-1;i++)if(t>=T[i])si=i;
  sceneEls.forEach((e,i)=>e.style.visibility=i===si?'visible':'hidden');
  updaters[si]((t-T[si])*S[si]);
  // background motion
  document.getElementById('grid').style.backgroundPosition=`0 ${t*90}px`;
  document.getElementById('glowA').style.transform=`translate(${Math.sin(t*.5)*80}px,${Math.cos(t*.4)*60}px)`;
  document.getElementById('glowB').style.transform=`translate(${Math.cos(t*.45)*90}px,${Math.sin(t*.5)*70}px)`;
  document.getElementById('bar').style.width=(t/TOTAL*100)+'%';
  hud.innerHTML=si>=2&&si<=6?`0${si-1} <span style="color:var(--o)">/</span> 05`:'';hud.style.opacity=si>=2&&si<=6?1:0;
  // transition wipes at each boundary
  let wp=-1;for(let i=1;i<T.length-1;i++){const p=(t-(T[i]-.22))/.44;if(p>-.3&&p<1.3)wp=p;}
  wipes.forEach((w,i)=>{if(wp<0){w.style.transform='translateX(0)';w.style.left='-2400px';return}
    const q=clamp(wp-i*.09,-.1,1.1);const e=eIO(clamp(q));w.style.left=(-2400+e*(1920+2400+700))+'px'});
  // beat rings
  const b=(t*1.2)%1;rings.innerHTML=`<circle cx="960" cy="540" r="${300+b*700}" fill="none" stroke="rgba(58,123,200,${.12*(1-b)})" stroke-width="2"/>`;
}
window.renderAt=renderAt;window.TOTAL=TOTAL;
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);const st=document.getElementById('stage');st.style.transform=`scale(${s})`;st.style.left=(innerWidth-1920*s)/2+'px';st.style.top=(innerHeight-1080*s)/2+'px'}
const params=new URLSearchParams(location.search);
window.ready=document.fonts.ready.then(()=>{renderAt(0);});
if(!params.has('render')){fit();addEventListener('resize',fit);document.fonts.ready.then(()=>{const t0=performance.now();(function loop(){renderAt(((performance.now()-t0)/1000)%TOTAL);requestAnimationFrame(loop)})()});}
</script>
