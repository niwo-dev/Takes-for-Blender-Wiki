      - Recover Your Take Organisation: workflows/recover_take_organisation.md

  - How It Works:
    - The Takes System: features/takes.md
    - Takes & the Review Loop: features/vl_versions.md
    - The Cascade: features/cascade.md
    - Actions, Managed and Pinned: features/actions.md
    - Rest State: features/rest_state.md
    - Diff State: features/diff_state.md
    - The Modes: features/modes.md
    - Which Tool for the Job: features/which_tool.md
    - Takes vs Other Tools: comparisons.md

  - Inside Takes:
    - Panels:
      - Navigation Panel: interface/navigation_panel.md
      - Inspector Panel: interface/inspector_panel.md
      - Context Properties: interface/context_properties.md
      - Variant Tree: interface/variant_tree.md
      - Globals Panel: features/globals.md
      - Keyboard Shortcuts: interface/hotkeys.md
    - Features:
      - Setting Up Looks:
        - Variant Switch: features/variant_switch.md
        - Render Presets: features/render_presets.md
        - Tag Library: features/tags.md
        - Rules: features/rules.md
      - Naming & Output:
        - Smart Output: features/smart_output.md
        - Custom Tokens: features/custom_tokens.md
        - Batch Render: features/batch_render.md
      - Working Faster:
        - Pie Menus: features/pie_menus.md
        - Bookmarks: features/bookmarks.md
        - View Layer Preview: features/vl_preview.md
        - Viewport Sync: features/viewport_sync.md
      - Modes & Safety:
        - Still Mode: features/still_mode.md
