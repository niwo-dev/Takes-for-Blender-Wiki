site_name: Takes for Blender — User Guide
site_description: >-
  Stage Management, Variant Switching, and Batch Rendering pipeline
  for Product Visualization in Blender 5.1+.
site_author: Nikolaj Woroschilow
site_url: https://niwo-dev.github.io/Takes-for-Blender-Wiki/wiki/


validation:
  nav:
    omitted_files: ignore

copyright: "&copy; 2026 Nikolaj Woroschilow"

# NOTE: `extra:` is defined once, at the bottom of this file. YAML keeps only the
# last definition of a duplicate key, so a second block here would silently win
# over it (or be silently overridden) — keep them merged in one place.

plugins:
  - search
  - macros:
      module_name: macros
      on_error_fail: true

# Keeps the "What's New" section (changelog + roadmap) out of the search
# index — those pages are generated, so front matter can't carry the flag.
hooks:
  - hooks/search_exclude.py
  # Resolves the latest available addon version into `extra.addon_version`
  # for the header's GitHub version chip.
  - hooks/addon_version.py

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # 1. Standard Dark Mode (Default)
    - scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to Light Pattern
    # 2. Standard Light Mode
    - scheme: default
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to Dark Pattern
  features:
    - navigation.tabs
    - navigation.path
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.tracking
    - navigation.tooltip
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    logo: material/layers-triple
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md

  # Sections are named for what the reader wants, not for how the addon is built:
  # learn / do / look up / understand. Page PATHS are deliberately unchanged --
  # the addon deep-links ~867 controls at page#anchor targets, so moving files
  # would break right-click "Online Manual" for no reader benefit. Nav titles are
  # independent of paths, which is what makes this regrouping free.
  - Start Here:
    - getting_started/index.md
    - Install Takes: getting_started/installation.md
    - Your First Steps: getting_started/first_steps.md

  - Guides:
    - workflows/index.md
    - Make Animation Variants: workflows/animation_variants.md
    - Make Material Variants: workflows/material_variants.md
    - Batch Render Your Takes: workflows/batch_rendering.md

  - How It Works:
    - The Takes System: features/takes.md
    - Takes & the Review Loop: features/vl_versions.md
    - The Cascade: features/cascade.md
    - Rest State: features/rest_state.md
    - Takes vs Other Tools: comparisons.md

  - Buttons & Settings:
    - Panels:
      - interface/index.md
      - Navigation Panel: interface/navigation_panel.md
      - Inspector Panel: interface/inspector_panel.md
      - Context Properties: interface/context_properties.md
      - Variant Tree: interface/variant_tree.md
      - Keyboard Shortcuts: interface/hotkeys.md
    - Features:
      - features/index.md
      - Variant Switch: features/variant_switch.md
      - Tag Library: features/tags.md
      - Rules: features/rules.md
      - Globals Panel: features/globals.md
      - Smart Output: features/smart_output.md
      - Custom Tokens: features/custom_tokens.md
      - Render Presets: features/render_presets.md
      - Batch Render: features/batch_render.md
      - Video Sequencer: features/sequencer.md
      - View Layer Preview: features/vl_preview.md
      - Still Mode: features/still_mode.md
      - Value Lock: features/value_lock.md
      - Bookmarks: features/bookmarks.md
      - Pie Menus: features/pie_menus.md
      - Process Monitor: features/process_monitor.md
      - Viewport Sync: features/viewport_sync.md
      - AI Assistant: features/ai_assistant.md
    - Preferences:
      - preferences/index.md
      - Workflow: preferences/workflow.md
      - Interface: preferences/ui.md
      - Data: preferences/data.md
      - Developer: preferences/debug.md
      - Advanced: preferences/advanced.md

  - FAQ: faq.md

  - What's New:
    - whats_new/index.md
    - Changelog: changelog/index.md
    - Changelog (Dev): changelog/dev.md
    - Roadmap: roadmap/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
      # Left-nav (toc.integrate) shows only top-level headings — e.g. the
      # changelog lists versions (##), not each Added/Changed/Fixed (###).
      toc_depth: 2

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/toc-icons.js
  - javascripts/roadmap-sort.js
  - javascripts/changelog-toc.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/niwo-dev/Takes-for-Blender
