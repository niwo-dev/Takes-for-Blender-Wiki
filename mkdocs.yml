site_name: Takes for Blender — User Guide
site_description: >-
  Stage Management, Variant Switching, and Batch Rendering pipeline
  for Product Visualization in Blender 5.1+.
site_author: Nikolaj Woroschilow
site_url: https://niwo-dev.github.io/Takes-for-Blender-Wiki/wiki/


validation:
  nav:
    omitted_files: ignore

copyright: "&copy; 2026 Nikolaj Woroschilow"

# NOTE: `extra:` is defined once, at the bottom of this file. YAML keeps only the
# last definition of a duplicate key, so a second block here would silently win
# over it (or be silently overridden) — keep them merged in one place.

plugins:
  - search
  - macros:
      module_name: macros
      on_error_fail: true

# Keeps the "What's New" section (changelog + roadmap) out of the search
# index — those pages are generated, so front matter can't carry the flag.
hooks:
  - hooks/search_exclude.py
  # Resolves the latest available addon version into `extra.addon_version`
  # for the header's GitHub version chip.
  - hooks/addon_version.py

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # 1. Standard Dark Mode (Default)
    - scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to Light Pattern
    # 2. Standard Light Mode
    - scheme: default
      primary: black
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to Dark Pattern
  features:
    # No navigation.tabs: the drawer now carries the whole tree, so a top
    # row of the same section names was the menu twice. Dropping it also
    # means the drawer opens at the TOP of the nav rather than scoped to
    # the current section.
    # Ajax page loads: Material swaps content instead of reloading, so the
    # header, drawer and search survive navigation. Every custom script in
    # docs/javascripts/ subscribes to document$ rather than DOMContentLoaded,
    # because that fires once per session under instant loading.
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    # No navigation.sections / navigation.expand: those render groups as flat,
    # always-open headers. Without them the sidebar groups collapse, which is
    # what keeps a 17-page section from swamping the menu.
    - navigation.top
    # No navigation.indexes: it turns a section's own page into the section
    # link, so some menu rows navigated while others expanded. Every group
    # now does the same thing -- expand.
    - navigation.footer
    - navigation.tracking
    - navigation.tooltip
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    logo: material/layers-triple
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md

  # Sections are named for what the reader wants, not for how the addon is built:
  # learn / do / look up / understand. Page PATHS are deliberately unchanged --
  # the addon deep-links ~867 controls at page#anchor targets, so moving files
  # would break right-click "Online Manual" for no reader benefit. Nav titles are
  # independent of paths, which is what makes this regrouping free.
  - Start Here:
    - Install Takes: getting_started/installation.md
    - The Six Levels: getting_started/first_steps.md
    - Your First Take: getting_started/first_take.md
    - Your First Batch Render: getting_started/first_batch_render.md

  - Course:
    - Syllabus: course/index.md
    - Stage A · Think in Takes:
      - "A1 · Why Takes exists": course/a1-why-takes.md
      - "A2 · Install and look around": course/a2-install-and-look-around.md
      - "A3 · Your first take": course/a3-your-first-take.md
      - "A4 · The Cascade": course/a4-the-cascade.md
      - "A5 · Actions, slots, managed and pinned": course/a5-actions-slots-managed-pinned.md
      - "A6 · Frame 0 is home": course/a6-frame-0-is-home.md
      - "A7 · When it looks wrong": course/a7-when-it-looks-wrong.md
      - "A8 · Getting help": course/a8-getting-help.md
    - Stage B · Build looks and shots:
      - "B1 · Cameras and lighting": course/b1-cameras-and-lighting.md
      - "B2 · Looks: swap first, then variants": course/b2-looks-swap-then-variants.md
      - "B3 · Animation variants": course/b3-animation-variants.md
      - "B4 · Presets": course/b4-presets.md
      - "B5 · Tags and Rules": course/b5-tags-and-rules.md
      - "B6 · Which tool for this job?": course/b6-which-tool-for-this-job.md
    - Stage C · Ship it:
      - "C1 · Names": course/c1-names.md
      - "C2 · Batch Render": course/c2-batch-render.md
      - "C3 · Project and team": course/c3-project-and-team.md
      - "C4 · Capstone: one product, end to end": course/c4-capstone.md
    - Stage D · Power tools:
      - "D1 · Working fast": course/d1-working-fast.md
      - "D2 · Beyond the viewport": course/d2-beyond-the-viewport.md
      - "D3 · The AI Assistant": course/d3-ai-assistant.md

  - Guides:
    - Working with Takes:
      - Switch Between Takes: workflows/switch_takes.md
      - Keep an Object's Own Animation: workflows/keep_an_objects_own_animation.md
      - Lock a Value: workflows/lock_a_value.md
      - Show One Camera at a Time: workflows/show_one_camera.md
    - Looks & Variants:
      - Make Material Variants: workflows/material_variants.md
      - Make Animation Variants: workflows/animation_variants.md
      - Tag & Filter Takes: workflows/tag_and_filter.md
    - Rendering:
      - Batch Render Your Takes: workflows/batch_rendering.md
