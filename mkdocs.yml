      - Data: preferences/data.md
      - Developer: preferences/debug.md
      - Advanced: preferences/advanced.md

  - FAQ: faq.md

  - Troubleshooting: troubleshooting.md

  - What's New:
    - Overview: whats_new/index.md
    - Changelog: changelog/index.md
    - Changelog (Dev): changelog/dev.md
    - Roadmap: roadmap/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
      # The right-hand contents column shows only top-level headings — e.g. the
      # changelog lists versions (##), not each Added/Changed/Fixed (###).
      toc_depth: 2

extra_css:
  - stylesheets/extra.css?v=dc7e2c2d

extra_javascript:
  - javascripts/nav-icons.js?v=f681236a
  - javascripts/toc-icons.js?v=e5d33e6b
  - javascripts/footer-nav-sticky.js?v=f58c92f5
  - javascripts/roadmap-sort.js?v=71afec24
  - javascripts/roadmap-tooltip.js?v=f17c88d3
  - javascripts/changelog-toc.js?v=9b4e6d01
  - javascripts/lesson-tooltip.js?v=18266d9d
  - javascripts/toc-min-pill.js?v=1bb6008e
  - javascripts/toc-popover.js?v=16b0ee56

# No `social:` list. It only ever held the GitHub icon, and the header already
# carries a GitHub link with the version chip — the footer copy was the same
# destination a second time. Adding a key here brings the footer icon row back.
extra: {}
